# Префикс плагина
prefix: "<gradient:#00ffcc:#0066ff>[AutoMessage]</gradient> "

# Сообщения для команд
command-messages:
  reload: "<green>✅ Конфиг успешно перезагружен!</green>"
  no-permission: "<red>⛔ У вас нет прав для этой команды!</red>"
  unknown: "<yellow>🤔 Неизвестная команда. Попробуйте /automessage reload</yellow>"

# Сообщения для рассылки
messages:
  # 1. Классическое сообщение в чат с PlaceholderAPI и кликом
  - text: "<gold>Добро пожаловать, <green>%player_name%</green>!</gold> <newline><click:run_command:'/shop'><aqua>[Открой магазин]</aqua></click>"
    type: chat
    period: 120

  # 2. Сообщение в actionbar c PlaceholderAPI
  - text: "<yellow>Ваш баланс: <green>%vault_eco_balance_fixed%</green> монет</yellow>"
    type: actionbar
    period: 180

  # 3. Сообщение с кликом по ссылке
  - text: "<blue>📢 Подпишитесь на наш Discord! </blue><click:open_url:'https://discord.gg/yourserver'><gradient:#ff00ff:#00ffff>[ЖМИ]</gradient></click>"
    type: chat
    period: 300

  # 4. Сообщение title (заголовок + подзаголовок)
  - text:
      title: "<gradient:#ff0000:#ffaa00>⚔ PvP Зона!</gradient>"
      subtitle: "<white>Осторожно, <red>пвп включено!</red></white>"
    type: title
    period: 400

  # 5. Сложный градиент с иконками
  - text: "<gradient:#ff00cc:#6600ff>❖ Голосуйте за сервер каждые 24 часа! ❖</gradient> <newline><click:open_url:'https://topcraft.ru/vote'><yellow>[Голосовать]</yellow></click>"
    type: chat
    period: 600

  # 6. Комбинация: actionbar с прогрессом
  - text: "<green>⏳ Осталось <aqua>%server_time_12%</aqua> до ивента!</green>"
    type: actionbar
    period: 60

  # 7. Огромный title с плавными цветами
  - text:
      title: "<gradient:#00ff00:#006600>🌱 Сажайте деревья!</gradient>"
      subtitle: "<yellow>Купите саженцы в /shop</yellow>"
    type: title
    period: 900
